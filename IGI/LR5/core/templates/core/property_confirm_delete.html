{% extends "base.html" %}
{% block title %}Удаление{% endblock %}
{% block content %}
<h2>Удалить «{{ property.title }}»?</h2>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'property_detail' property.pk %}">Отмена</a>
</form>
{% endblock %}
