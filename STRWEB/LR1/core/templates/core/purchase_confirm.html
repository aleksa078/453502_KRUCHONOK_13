{% extends "base.html" %}
{% block title %}Покупка объекта{% endblock %}
{% block content %}
<h2>Подтверждение покупки</h2>
<p>Объект: <strong>{{ property.title }}</strong></p>
<p>Цена: {{ property.price }} BYN</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Купить</button>
    <a href="{% url 'property_detail' property.pk %}">Отмена</a>
</form>
{% endblock %}
